<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="../styles/output.css" rel="stylesheet">
</head>
<body class="m-0 p-3 text-[13px] leading-normal font-sans bg-bg text-text min-w-[320px]">
  <header class="flex items-center justify-between mb-3">
    <h1 class="text-[15px] m-0 text-accent">ServiceNow Ticket Analyzer</h1>
    <span id="connState" class="badge">Not connected</span>
  </header>

  <section class="card">
    <label class="block text-[11px] text-dim my-2.5 uppercase tracking-wider">Instance URL</label>
    <div class="flex gap-2">
      <input id="instance" type="url" placeholder="https://yourcompany.service-now.com" class="input flex-1 min-w-0">
      <button id="connectBtn" class="btn">Connect</button>
      <button id="settingsBtn" type="button" class="linklike" data-tip="Open settings">&#9881; Settings</button>
    </div>
  </section>

  <section class="card">
    <h2 class="text-xs m-0 mb-1.5 text-muted uppercase tracking-wider">Filters</h2>

    <div id="filterListCard" class="hidden bg-card2 border border-line rounded-lg px-2.5 pt-2.5 pb-1.5 mb-3">
      <label class="block text-[11px] text-dim my-2.5 uppercase tracking-wider">Saved filter sets (Run pulls all of them)</label>
      <div id="filterListBox"></div>
      <button id="clearFilterListBtn" type="button" class="linklike">Clear all — run uses the live filters only</button>
    </div>

    <label class="block text-[11px] text-dim my-2.5 uppercase tracking-wider">Ticket type</label>
    <select id="ticketType" class="select">
      <option value="incident">Incident</option>
      <option value="change_request">Change Request</option>
      <option value="problem">Problem</option>
      <option value="sc_req_item">Requested Item (RITM)</option>
      <option value="sc_task">Catalog Task (SCTASK)</option>
    </select>

    <label class="block text-[11px] text-dim my-2.5 uppercase tracking-wider">Conditions (AND / OR)</label>
    <div id="condRows"></div>
    <button id="addCondBtn" type="button" class="linklike">+ Add condition</button>

    <button id="addFilterBtn" type="button" class="w-full mt-2.5 bg-line font-medium py-2.5 rounded cursor-pointer text-text hover:brightness-110">+ Add to filter list</button>

    <label class="flex items-center gap-2 mt-3 text-[11.5px] text-muted cursor-pointer select-none" data-tip="Also pull this week's change requests to fill the Weekly Summary sheet (last week implemented/failed, next week planned) plus P1/P2 incidents from last week">
      <input id="includeSummary" type="checkbox" class="accent-accent">
      <span>Pull change requests for Weekly Summary</span>
    </label>

    <details id="advancedBox" class="mt-2.5">
      <summary class="text-xs text-dim cursor-pointer">Advanced — raw query override / generated query</summary>
      <textarea id="rawQuery" placeholder="Optional: extra encoded query conditions, e.g. priority=1^category=network" class="textarea mt-2"></textarea>
      <label class="block text-[11px] text-dim my-2.5 uppercase tracking-wider">Generated query</label>
      <pre id="generatedQuery" class="mono"></pre>
    </details>
  </section>

  <section class="flex gap-2 mb-2.5">
    <button id="previewBtn" class="btn flex-1 py-2.5">Preview</button>
    <button id="runBtn" class="btn-primary flex-1 py-2.5">Run</button>
  </section>
  <section class="flex gap-2 mb-2.5">
    <button id="viewBtn" class="w-full bg-line font-medium py-2.5 rounded cursor-pointer text-text hover:brightness-110">Open data view</button>
  </section>

  <section id="progressWrap" class="hidden">
    <div class="h-[7px] bg-card2 rounded overflow-hidden"><div id="fill" class="h-full w-0 bg-peach transition-[width] duration-300"></div></div>
    <div id="stageLabel" class="text-[11.5px] text-dim mt-1.5 min-h-4"></div>
    <div id="pullCounter" class="hidden text-[12.5px] text-accent mt-1 font-semibold"></div>
  </section>

  <section class="card log-card hidden" id="logCard">
    <h2 id="logHead" class="text-xs m-0 mb-1 text-muted uppercase tracking-wider cursor-pointer select-none hover:text-accent" data-tip="Click to open full log">Log <span id="logErrBadge" class="hidden bg-bad/20 text-[#f5e0dc] rounded-lg px-1.5 text-[10px] ml-1"></span></h2>
    <div id="log" class="max-h-40 overflow-y-auto text-[11px] leading-relaxed text-muted font-mono break-words"></div>
  </section>

  <div id="logModal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-card2/70">
    <div class="log-box w-[min(720px,94vw)] max-h-[78vh] bg-card border border-line rounded-xl shadow-[0_18px_60px_rgba(0,0,0,.55)] flex flex-col overflow-hidden">
      <div class="flex items-center gap-2.5 px-3.5 py-2.5 border-b border-line font-semibold text-muted text-[12.5px]">
        <span>Request &amp; activity log</span>
        <button id="logCopy" type="button" class="linklike ml-auto">Copy all</button>
        <button id="logClose" type="button" class="ml-1 bg-transparent border-0 text-dim cursor-pointer text-sm px-1.5 py-0.5 hover:text-bad" data-tip="Close">&#10005;</button>
      </div>
      <div id="logMirror" class="overflow-y-auto font-mono text-[11.5px] leading-relaxed text-muted px-3.5 py-2.5 break-words whitespace-pre-wrap"></div>
    </div>
  </div>

  <footer id="lastRun" class="text-[10.5px] text-faint mt-2"></footer>

  <script type="module" src="panel.js"></script>
</body>
</html>
